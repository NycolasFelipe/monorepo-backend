services:
  api_gateway:
    container_name: api_gateway
    build: 
      dockerfile: gateway.dockerfile
    env_file:
      - ./gateway/.env
    environment:
      - PORT=${PORT}
    ports:
      - "${PORT}:${PORT}"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure

networks:
  backend:
    external: true
