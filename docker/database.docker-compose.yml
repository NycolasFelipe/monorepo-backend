services:
  mysql:
    image: mysql:8.0
    container_name: sequelize_mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  database-init:
    build:
      context: ..
      dockerfile: docker/database.dockerfile
    container_name: sequelize_database_init
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge